description: offer-letter-eval
providers:
  - python:./return_generated.py

prompts:
  - "{{prompt}}"

tests:
  - vars:
      prompt: "以下の学生情報と企業情報を根拠に、学生に向けた魅力的なオファー推薦文を日本語で200字以内で生成してください。"
      context: "学生: Python/SQL/機械学習基礎。EC需要予測(時系列)をPython実装。レコメンド試作。裁量大・少人数・実サービス志向。企業FinNova: FinTech。与信高度化。データサイエンスインターン。Python/dbt/BigQuery。少数精鋭・A/B検証・スピード重視。"
      generated: "Pythonでの需要予測PJ経験は、FinNovaの与信モデル改善に直結します。少数精鋭でA/B検証を高速に回す文化も志向に合致。実データで価値検証しながら、実装力を伸ばしませんか？"
      reference: "Pythonでの需要予測経験を、FinNovaの与信高度化に活かせます。少数精鋭でA/B検証を回す環境で、実データを使った価値検証に挑戦しませんか？"
    assert:
      - type: answer-relevance
      - type: context-faithfulness
      - type: factuality
        value: "{{reference}}"

  - vars:
      prompt: "以下の学生情報と企業情報を根拠に、学生に向けた魅力的なオファー推薦文を日本語で200字以内で生成してください。"
      context: "学生: Python/統計基礎/可視化。回帰分析実装。学内データ可視化レポート。学び・メンター志向。企業RetailPulse: RetailTech。店舗最適化。データアナリストインターン。Python/Looker。メンタリング・ドキュメント重視。"
      generated: "AWS認定とTOEIC900の強みを活かし、RetailPulseでグローバル案件の分析をリードできます。Looker×Pythonで店舗最適化を推進し、メンターのもと急成長しませんか？"
      reference: "Pythonと可視化の経験を活かし、RetailPulseでLooker×分析に挑戦できます。メンタリングとドキュメント文化のもと、回帰分析など基礎を実務で伸ばしませんか？"
    assert:
      - type: answer-relevance
      - type: context-faithfulness
      - type: factuality
        value: "{{reference}}"
